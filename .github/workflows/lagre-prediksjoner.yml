name: Lagre prediksjoner

# Kjører hver morgen. Skriptet lagrer bare når en ny runde er klar og ikke har startet,
# så de fleste dagene skjer det ingenting.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lagre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m src.snapshot

      - name: Commit nye prediksjoner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions
          if git diff --cached --quiet; then
            echo "Ingenting nytt å lagre."
          else
            git commit -m "Lagre prediksjoner for neste runde"
            git push
          fi
